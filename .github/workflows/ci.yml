name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      CHAT_PROVIDER_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      # Full domain E2E joins CI when its fixture harness is available.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:db
      - run: npm run db:start
      - run: npm run db:reset:local
      - run: npm run db:seed:verify
      - run: npm run test:db:seed
      - run: npm run db:types:local -- --check
      - run: npm run test:db:tooling
      - if: always()
        run: npx supabase stop
